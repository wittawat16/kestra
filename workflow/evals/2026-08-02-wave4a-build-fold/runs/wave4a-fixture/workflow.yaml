stages:
  - id: spec-review
    depends_on: []
    brief: >
      Review 0-spec.md for the defects that are cheap to fix now and expensive to fix after tests
      are frozen: every AC testable without a follow-up question, every Runtime Invariant naming
      what actually happens on violation, and the Reality Constraints filled in. Write the verdict
      to spec-verdict.md, first line exactly "VERDICT: CLEAR" or "VERDICT: CHANGES_REQUESTED".
    write_scope: []
    exit_criteria:
      type: command
      run: "grep -q '^VERDICT: CLEAR$' spec-verdict.md"
    on_fail:
      action: reworking
      reason: "spec has gaps or contradictions — resolve before any test or code exists"

  - id: generate-tests
    depends_on: [spec-review]
    brief: >
      Write the failing tests for all five ACs in the spec's AC Coverage Map, across
      tests/csv_export/test_writer.py, test_api.py and test_stream.py. Tests only — no
      implementation. This is the pre-freeze window: a defective test is cheap to fix here and
      expensive afterwards.
    write_scope: ["tests/csv_export/**"]
    exit_criteria:
      type: command
      run: "python3 -m pytest tests/csv_export --collect-only -q"
    on_fail:
      action: fixing
      max_attempts: 2
      escalate_at: 2

  - id: freeze-tests
    depends_on: [generate-tests]
    freeze_after: true
    brief: >
      Freeze the test files: record every test file's sha256 in state.json. After this stage passes,
      only a reworking pass may touch a test path.
    write_scope: ["tests/csv_export/**"]
    exit_criteria:
      type: command
      run: "python3 -m pytest tests/csv_export --collect-only -q"
    on_fail:
      action: reworking
      reason: "the frozen test set does not even collect — freezing it would freeze a lie"

  - id: implement-csv-writer
    depends_on: [freeze-tests]
    brief: |
      <!-- ticket:begin 01-csv-writer sha256:c9a89fea09ac36e028eb0924fc6ceea3b80cd991ae72d8f07f39c7acaf80a956 -->
      ## What to build
      The CSV writer: the header row, RFC 4180 quoting, and the header-only shape for an empty result
      set. Nothing HTTP-facing — the writer takes rows and yields text.

      ## Acceptance criteria
      - [ ] AC-2 an export of an empty result set returns a header-only CSV (Source: US-1)
      - [ ] AC-4 a cell containing a comma or a quote is quoted per RFC 4180

      ## Blocked by
      - nothing
      <!-- ticket:end 01-csv-writer -->

      Folded in at build time from tickets/01-csv-writer.md. Do not edit this block — see
      workflow-schema.md "re-fold, never hand-edit". Source for each AC above: the spec's AC
      Coverage Map (AC-2 → US-1, AC-4 → ID§csv-quoting).

      Implement only src/csv_export/writer.py. The frozen tests are the specification; do not touch
      a test file — if a test looks wrong, escalate rather than edit it.
    write_scope: ["src/csv_export/writer.py"]
    exit_criteria:
      type: command
      run: "python3 -m pytest tests/csv_export/test_writer.py -q"
      progress: "number of failing assertions reported by `python3 -m pytest tests/csv_export/test_writer.py` — must reach 0, from a baseline of 3 failing / 0 passing."
    on_fail:
      action: fixing
      max_attempts: 3
      escalate_at: 3

