# Generated by kestra-build from spec-full/0-spec.md — form B (monolithic fold: one 0-spec.md,
# no sliced ticket set named, so no tickets: map, no embedded ticket blocks, and no spec_anchor
# (the spec carries no "> Spec-ticket:" preamble marker — its preamble is a Status line)).
#
# PATH CONVENTION: every path in this file, and every exit_criteria command, is relative to the
# directory that contains BOTH this run folder (run-2-after-full/) and the target repo (fixture/).
# kestra-run must be invoked from there. Commands that need the repo's own cwd say so with an
# explicit "cd fixture &&" rather than assuming one.
feature: priority-tier
source_spec: spec-full/0-spec.md
mode: full

stages:
  - id: spec-review
    depends_on: []
    brief: >
      Review spec-full/0-spec.md for the defects that are cheap to fix now and expensive to fix
      after the tests are frozen. The mechanical layer of this stage's exit_criteria
      (validate_spec.py) verified presence and existence only — the semantic content of every
      column is still yours to judge: no on-violation resolving to log-and-continue, no
      contradiction between Runtime Invariants, Edge Cases and the acceptance criteria, every AC
      testable without a follow-up question, and every checkable claim the spec makes actually run
      rather than asserted. Do not treat the mechanical pass as covering any of that.
      Four specific things to judge here, all of them already visible at generation time.
      (1) The spec's Open Items entry says a handler throwing a non-Error value would leave the
      dropped message's error field undefined, which would itself trip Runtime Invariant 1
      (non-empty error string) and halt. Decide whether that is a genuine contradiction between
      Open Items and Runtime Invariant 1 that must be resolved in the spec now, or an acceptable
      deferral to generate-tests/implement with both options named. It is the single most likely
      real finding in this spec.
      (2) Runtime Invariant 2 (a defensive assertion that only the literal string free may reach
      the drop branch) is unreachable by construction while the tier ternary is the spec's own
      one-liner. Judge whether an invariant that no test can exercise is still correctly specified
      as halt-on-violation, or whether the spec should say plainly that it guards a future
      refactor and cannot be asserted by the frozen suite.
      (3) Two items in this spec are explicitly labelled as inferred rather than stated by the
      originating idea: the unrecognized-tier-defaults-to-paid rule, and the Edge Cases note that
      extends missing-tier reasoning to any non-free value. Review the inference itself; do not
      assume a human already blessed it because it is written in the spec's own voice.
      (4) validate_spec.py reports five WARNs against this spec, all of them template-shape gaps
      rather than content defects: no Source column in the AC Coverage Map, no External Interface
      section, no Mode Prediction line, no Exit Criteria section, no Delimiter precondition line.
      They do not fail the mechanical check and they are not yours to invent content for. Say
      whether any of them hides a real gap. The absent Exit Criteria section is the reason no
      stage in this workflow carries exit_criteria.progress, which is the normal case.
      Any numeric finding must name the exact quantity measured, the inputs, and the command or
      script used, with its output pasted — a numeric claim without them is not a finding yet. Any
      other blocking finding carries a command whose exit code flips once it is addressed, where
      such a command exists; a judgment-only finding does not, and inventing a fake one to satisfy
      the format is worse than omitting it. Anything that took real computation writes its result
      AND the exact command that produced it into run-2-after-full/evidence/.
      Write the verdict to run-2-after-full/spec-verdict.md. First line exactly VERDICT: CLEAR or
      VERDICT: CHANGES_REQUESTED, then a findings table with one row per finding (severity, the
      claim in one line, file:line), then any evidence paths. Your write_scope is the spec file
      itself, so a finding you can fix in place, you fix in place.
    write_scope: ["spec-full/0-spec.md"]
    exit_criteria:
      type: command
      run: "python3 run-2-after-full/validate_spec.py spec-full/0-spec.md fixture && grep -q '^VERDICT: CLEAR$' run-2-after-full/spec-verdict.md"
    on_fail:
      action: fixing
      max_attempts: 2
      escalate_at: 2
      reason: >
        bounded attempt to fix the spec in place; falls through to reworking once the two attempts
        are exhausted or the same diff repeats without resolving the finding

  - id: generate-tests
    depends_on: [spec-review]
    brief: >
      Write the frozen test suite for the tier-based retry policy. No implementation exists yet, so
      these tests must be red for the right reason (missing feature), never red because the file
      stopped collecting.
      FIRST ARTIFACT, before any test code: write run-2-after-full/test-scenarios.md — a table
      mapping every acceptance criterion, business rule (BR-1 to BR-4) and edge case in
      spec-full/0-spec.md to a scenario title and its Given/When/Then, one row per scenario, 1:1
      traceable in both directions. The spec's ACs are already written as Given-When-Then, so
      mirror that structure one-to-one in the test names and bodies. Do NOT introduce Gherkin
      tooling: CLAUDE.md mandates zero third-party dependencies, so the idiomatic form here is
      node:test test() blocks whose name reads as the scenario and whose body is laid out
      Given / When / Then.
      WHERE THE TESTS GO: fixture/test/queue.test.js, the existing file, per this repo's
      convention that one test file mirrors one source file. The two tests already in it must keep
      passing — this stage's exit_criteria asserts both by name. Do NOT touch fixture/package.json:
      it is deliberately outside both this stage's write_scope and the freeze scope, because it
      holds the dependency list as well as the test script and freezing it would turn an unrelated
      version bump during implementation into a frozen-tests-tampered halt.
      RUNNER PLUMBING, verified at generation time so you do not rediscover it: there is none to
      write. fixture/package.json already declares test as node --test test/*.test.js, node v22
      collects fixture/test/queue.test.js with no config file, no conftest equivalent and no
      pythonpath-style setup, and the baseline before your change is 2 tests / 2 passing / exit 0.
      The exact command your exit_criteria runs was verified standalone at generation time:
      cd fixture && node --test test/*.test.js, with the greps described below over its output.
      IMPORT DISCIPLINE, and this one is load-bearing: getMetrics does not exist in
      fixture/src/queue.js yet. Verified by direct execution at generation time — a named import of
      it (import { getMetrics } from '../src/queue.js') is an ESM link-time SyntaxError that
      collapses the ENTIRE file into a single failure, taking the two pre-existing passing tests
      with it, and node --check never sees it because it does not resolve imports. Reference every
      not-yet-existing export through a namespace import instead (import * as queue from
      '../src/queue.js', then queue.getMetrics(...)), keeping the existing named imports for
      createQueue, enqueue, registerHandler and step, which do exist. With the namespace import the
      same suite reported 4 tests / 2 passing / 2 failing on their own assertions, which is the
      shape your exit_criteria requires.
      TEST DOUBLE DISCIPLINE: use the real registry and real in-memory queues. Register handlers
      through the real registerHandler export and let a failing handler be a plain function that
      throws — no mock library, no node:test mock helpers. HANDLERS is module-level global state
      shared across the whole test process (fixture/src/queue.js line 4), so every new handler type
      string must be distinct from the existing email and boom, or you will silently collide with
      the two tests that must keep passing.
      COVERAGE YOU MUST NOT SKIP: note that three of the spec's ACs describe behavior that already
      passes today (the no-handler skipped path, a free-tier success going to done, and the
      pre-existing retry). Write them anyway — they are the regression fence that proves the tier
      branch did not leak into the success or no-handler paths — and say in test-scenarios.md which
      scenarios are expected green before implementation and which red, so a reviewer can tell an
      expected green from a vacuous test. Runtime Invariant 1 (a dropped message always carries
      attempts >= 1 and a non-empty error string) is assertable and should have a scenario.
      Runtime Invariant 2 is unreachable while the tier resolution is the spec's own one-line
      ternary — say so explicitly in test-scenarios.md rather than writing a test that cannot fail.
      BEFORE FINISHING: cross-check the assumptions your scenarios share — the handler type strings,
      the exact result-object shapes, the error string each throwing handler produces, the queue
      fixture shape — and name each pair you checked. There is one test file here, so the classic
      two-files-disagree defect cannot occur, but two scenarios inside one file can still assume
      different result shapes for the same call.
      COMMENTS: default to none. Write one only where the why is genuinely not visible from the
      code (a hidden constraint, a workaround, a reason a simpler form does not work), one line
      where one line does, and never a comment that names this run, a task, an AC id, a spec path
      or where a pattern was copied from — that belongs in the commit message and rots the moment
      this run folder is archived. Every commented line here gets re-pasted verbatim into every
      later stage that reads this diff.
      A test-writing or TDD-focused skill fits this stage well if you have one installed.
    write_scope: ["fixture/test/queue.test.js"]
    exit_criteria:
      type: command
      run: "cd fixture && node --test test/*.test.js > /tmp/kestra-priority-tier-polarity.log 2>&1; grep -q '^ok [0-9]* - runs a registered handler' /tmp/kestra-priority-tier-polarity.log && grep -q '^ok [0-9]* - retries a throwing handler' /tmp/kestra-priority-tier-polarity.log && grep -q '^not ok ' /tmp/kestra-priority-tier-polarity.log && ! grep -q 'does not provide an export named' /tmp/kestra-priority-tier-polarity.log"
    on_fail:
      action: fixing
      max_attempts: 3
      escalate_at: 2

  - id: test-review
    depends_on: [generate-tests]
    brief: >
      Read the tests just written against the spec's Reality Constraints, before the freeze, while
      a finding still costs a bounded fixing loop instead of a reworking bounce. Report a TABLE with
      one row per risk below, each marked applicable or n/a with file:line evidence — a prose
      write-up reports what you noticed, a table forces an answer for the rows you did not:
      ordering and preconditions (the double accepts any call sequence while the real dependency
      enforces one); response realism (only ever happy-path data); type or shape drift (hand-typed
      to an assumed shape rather than the real one); path parity (stands in for one of two paths
      that must agree with nothing comparing them); own shared logic (replaces a guard or invariant
      this codebase owns, so the real one goes unexercised); non-determinism (a live clock, RNG,
      locale or environment leaking in). Add rows this spec and codebase imply and say which you
      added.
      Where the real work is, per this spec's own Reality Constraints table: the double is a
      handler function registered into the real module-level HANDLERS map, and the documented
      non-guarantee is that a handler may throw a NON-Error value, in which case step()'s catch
      binds it with no type check and err.message is undefined. If every frozen test throws a real
      Error, the suite can never exercise the path the spec's Open Items entry describes, and
      Runtime Invariant 1 would halt on it in production. That is the own-shared-logic and
      response-realism pair in this suite, and it is the finding this stage most plausibly exists
      to catch here. Also check: that the registered type strings cannot collide with email or
      boom given HANDLERS is process-global; that the non-determinism row really is n/a (the spec
      claims no clock, RNG, locale, network, filesystem or env var is read anywhere in this
      feature — verify against the test file, do not take the claim on faith); and that the
      expected-green scenarios named in run-2-after-full/test-scenarios.md are genuinely
      regression fences rather than assertions so shallow they would pass against any
      implementation.
      Non-vacuity: the cheap proof already exists — generate-tests' exit_criteria recorded the suite
      failing on its own assertions before any implementation, with the pre-existing two tests
      still green. If you need more than that for a specific scenario, build a mutation harness in
      this project's own language under run-2-after-full/harness/: it takes a set of mutants (a
      patch, or an edit described precisely enough to apply) plus the command that runs the suite,
      and returns per mutant whether the suite caught it — a surviving mutant is the finding. It
      lives in the run folder, not in fixture/, it may already exist (extend it, never write a
      second one), and it is scaffolding for this run that is explicitly not held to the project's
      production standards.
      Anything that took real computation writes its result and the exact command that produced it
      into run-2-after-full/evidence/; an evidence file is only valid for the commit it was computed
      against, and evidence is an input to judgment, never a substitute for it — do not clear a
      finding on the strength of an artifact you did not verify.
      Write the verdict to run-2-after-full/test-verdict.md, first line exactly VERDICT: CLEAR or
      VERDICT: CHANGES_REQUESTED, then the risk table, then findings with file:line, then evidence
      paths. On a re-review after a fixing attempt (the context pack will include the fix diff and
      your own prior findings), verify the findings are addressed and review the changed lines and
      their interactions with the rest of the suite; do not re-derive relations between unchanged
      files already cleared, which the orchestrator's write_scope enforcement guarantees are
      unchanged.
    write_scope: []
    exit_criteria:
      type: command
      run: "grep -q '^VERDICT: CLEAR$' run-2-after-full/test-verdict.md"
    on_fail:
      action: fixing
      max_attempts: 3
      escalate_at: 2
      target: generate-tests

  - id: freeze-tests
    depends_on: [test-review]
    brief: >
      No edits. This stage exists to snapshot and commit the reviewed test suite as the frozen
      baseline every later stage is held to. Its exit_criteria re-runs generate-tests' own static
      checks, byte-identical, against the exact commit being locked — that is the whole of its
      work, and kestra-run can execute it directly without spawning anyone.
      Its write_scope is fixture/test/queue.test.js and nothing else, deliberately narrower than
      what a test suite might touch in general: everything in this scope becomes part of the
      test-hash, and any later change to it is a hard stop rather than a retry.
      fixture/package.json is therefore excluded on purpose (it carries the dependency list as well
      as the test script), and this project needs no other runner plumbing, so nothing is lost by
      excluding it.
    write_scope: ["fixture/test/queue.test.js"]
    freeze_after: true
    exit_criteria:
      type: command
      run: "cd fixture && node --test test/*.test.js > /tmp/kestra-priority-tier-polarity.log 2>&1; grep -q '^ok [0-9]* - runs a registered handler' /tmp/kestra-priority-tier-polarity.log && grep -q '^ok [0-9]* - retries a throwing handler' /tmp/kestra-priority-tier-polarity.log && grep -q '^not ok ' /tmp/kestra-priority-tier-polarity.log && ! grep -q 'does not provide an export named' /tmp/kestra-priority-tier-polarity.log"
    on_fail:
      action: reworking
      reason: "the tests no longer pass their own checks at the freeze point — resolve it upstream in spec-review or generate-tests; patching here would bypass the review that just approved them"

  - id: implement-tier-retry
    depends_on: [freeze-tests]
    brief: >
      Implement the tier-based retry policy in fixture/src/queue.js against the frozen tests. The
      test paths are frozen: do not modify fixture/test/** or fixture/package.json, and your diff
      is rejected at apply time if it does. Three changes, per the spec's Files to Touch:
      createQueue() also returns dropped: [], step()'s catch block gains the tier branch and the
      invariant guards, and a new named export getMetrics(queue) is added. Named exports only, ES
      modules, no third-party dependencies.
      GREEN TESTS ARE NOT THE WHOLE JOB. Install both checks the spec's Runtime Invariants section
      calls for, each one detecting its condition and halting rather than proceeding: immediately
      before queue.dropped.push(message), throw if the message does not carry a non-empty error
      string (an incomplete drop record must never be pushed); and at the top of the free-tier
      branch, throw unless message.tier is the literal string free, guarding against a future
      refactor loosening the check to case-insensitive or truthy. A guard that logs and continues
      satisfies the wording of that section while providing none of its value. The frozen tests
      were derived from anticipated cases and will pass whether or not these guards exist, and no
      exit_criteria can check for them, so their presence is on you here.
      Constraints the frozen tests may well not cover, from the spec's Codebase Survey and Reality
      Constraints: resolve tier with the same one-line expression in BOTH call sites (step()'s
      catch block and getMetrics) so a future tier value cannot be classified differently by the
      two — the spec deliberately declines to extract a helper for this, so keep the expression
      identical rather than paraphrasing it; derive getMetrics' counts by scanning queue.done and
      queue.dropped at call time, never from a separately maintained counter that could drift; and
      keep every result-object and message-object change purely additive (do not rename or remove
      id, status, attempts).
      ONE OPEN DECISION, and it is yours to make and to state: the spec's Open Items entry notes a
      handler throwing a non-Error value makes err.message undefined, which would trip the first
      invariant and halt. Either accept the halt as correct (a handler throwing a non-Error is
      itself a bug worth surfacing loudly) or coerce with String(err) as a fallback when
      err.message is absent. Both are defensible; pick one, implement it, and say which you picked
      and why in your stage output so review can judge the choice rather than rediscover the
      question. If spec-review already resolved it in the spec, follow the spec.
      COMMENTS: default to none. One line only where the why is genuinely not visible from the code
      itself, and never a comment naming this run, a task, an AC id, a spec path, or a
      copied-from path — that belongs in the commit message, and it gets re-pasted into every later
      stage that reads this diff. The existing file has two short why-comments at the top; match
      that density, do not exceed it.
      An implementation-focused skill fits this stage well if you have one installed.
    write_scope: ["fixture/src/queue.js"]
    exit_criteria:
      type: command
      run: "cd fixture && npm test"
    on_fail:
      action: fixing
      max_attempts: 3
      escalate_at: 2

  - id: verify-acceptance-criteria
    depends_on: [implement-tier-retry]
    brief: >
      Before doing anything else, check the frozen test suite (now real, unlike when this brief was
      written) against the spec's AC Coverage Map: does every AC map to an assertion that actually
      exists and actually runs under this stage's exit_criteria command? If yes for all of them,
      there is no judgment work here — say so plainly and stop. The real exit code of
      cd fixture && npm test IS the verification, and kestra-run can execute it directly without
      spawning you next time. Do not re-run the suite and paste its output as evidence: the
      orchestrator already ran exactly that command.
      If one or more ACs are NOT covered by any frozen assertion, name exactly which ones and
      exercise only those at runtime by hand, reporting what you observed against what the AC
      requires. Two candidates to look at first: the last AC (npm test exits 0 with all tests
      passing) is this stage's own exit_criteria rather than an assertion inside the suite, and the
      spec's two Runtime Invariants are not ACs at all — a missing guard is review's call, not
      yours, and it is structurally invisible to a test run.
    write_scope: []
    exit_criteria:
      type: command
      run: "cd fixture && npm test"
    on_fail:
      action: fixing
      max_attempts: 3
      escalate_at: 2
      target: implement-tier-retry

  - id: review
    depends_on: [implement-tier-retry]
    brief: >
      Review the real diff since the freeze commit for correctness, edge cases, and
      injection/authn/secrets risk. Passing tests only prove the spec's own acceptance criteria;
      this stage exists to catch what the spec never thought to test for. This is a sibling of
      verify-acceptance-criteria, not its successor — the diff is already final, so do not wait on
      or duplicate its work.
      Read the diff specifically for the things no exit_criteria can reach. Both Runtime Invariants
      from spec-full/0-spec.md: does the guard before queue.dropped.push actually exist, and does
      it halt rather than log and continue; does the free-branch assertion exist and reject every
      non-free value including undefined. Whether the tier resolution really is the identical
      expression in both call sites, so step() and getMetrics cannot classify a future tier value
      differently. Whether getMetrics derives its counts from queue.done and queue.dropped at call
      time rather than from any stored counter. Whether the result-shape and message-shape changes
      are purely additive. Whether the free-tier drop can be reached from the no-handler path,
      which the spec names as the specific bug risk to rule out (the handler lookup must return
      before the tier branch is ever consulted). And whether the implementer's stated choice on the
      non-Error-throw Open Item is coherent with the first invariant rather than quietly bypassing
      it.
      Any numeric finding names the quantity measured, the inputs, and the exact command or script,
      with the output pasted — a numeric finding without them is not a finding yet. Any other
      blocking finding carries a command whose exit code flips once it is addressed, where such a
      command exists; a judgment-only finding (missing error handling, an unclear name) has none,
      and inventing one to satisfy the format is worse than leaving it out. Anything expensive
      writes its result and the producing command into run-2-after-full/evidence/, and checks that
      directory first in case test-review already computed it against this same commit.
      Write the verdict to run-2-after-full/review-verdict.md. First line exactly VERDICT: CLEAR or
      VERDICT: CHANGES_REQUESTED, then a findings table with one row per finding (severity, the
      claim in one line, file:line), then evidence paths. If a finding genuinely needs more than a
      row, give it its row plus a short paragraph below the table — the point is to cut narration,
      never to cap what gets reported.
      Whatever code-review and security-review skills you have available both fit this stage well
      (code-review, security-review and scrutinize were installed on the machine that generated
      this workflow); try them, and proceed with a direct review if none are available.
    write_scope: []
    exit_criteria:
      type: command
      run: "grep -q '^VERDICT: CLEAR$' run-2-after-full/review-verdict.md"
    on_fail:
      action: fixing
      max_attempts: 3
      escalate_at: 2
      target: implement-tier-retry

  - id: done
    depends_on: [verify-acceptance-criteria, review]
    brief: >
      Every upstream stage passed. Write run-2-after-full/completion-summary.md: what shipped, the
      stage commits in order, the spec/test/review verdict artifacts and where they are, and the
      implementer's recorded decision on the non-Error-throw Open Item.
      Include a per-stage cost table sourced from what the orchestrator already tracked while
      running this workflow — do not re-derive or re-measure anything. Columns: stage id, subagent
      tokens, wall time, attempt count, and spawn type (fresh / resumed / none). For any stage
      whose attempts did not all happen inside one session, write "N/A — multi-session resume, not
      tracked" in the spawn-type cell rather than reconstructing a guess. A missing metric is an
      absent cell, never a stage failure. This table is what makes this run's mode-versus-cost
      trade-off visible without anyone having to ask for it afterwards: state plainly that this was
      a mode: full run of 8 stages, and which conditions forced full.
    write_scope: ["run-2-after-full/completion-summary.md"]
    exit_criteria:
      type: artifact_exists
      artifact: "run-2-after-full/completion-summary.md"
    on_fail:
      action: fixing
      max_attempts: 2
      escalate_at: 2
