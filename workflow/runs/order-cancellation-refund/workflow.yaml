feature: order-cancellation-refund
source_spec: workflow/runs/order-cancellation-refund/0-spec.md
# full: two independent components, and the spec's Reality Constraints list a payment-gateway
# dependency the tests will have to double.
mode: full

# NOTE: 0-spec.md is an illustrative example spec, not wired to a real codebase — its "Files to
# Touch" section explicitly says so. The write_scope globs below (src/orders/**,
# src/web/order-detail/**, src/inventory/**) are therefore reasonable ILLUSTRATIVE choices, not
# verified-real paths — and the same goes for every exit_criteria.run command (npm test
# --listTests, the eslint no-undef check, --testPathPattern filters, npm run test:e2e): none has
# been run against a real repo, so treat them as unverified placeholders too. Before running this
# with kestra-run against a real repo, replace globs AND commands with ones actually confirmed to
# work there.

stages:
  - id: spec-review
    depends_on: []
    brief: >
      Review workflow/runs/order-cancellation-refund/0-spec.md for the defects that are cheap to fix
      now and expensive to fix after tests are frozen. Check that every acceptance criterion is
      testable without a follow-up question; that each Runtime Invariant names what actually happens
      on violation and none amount to "log it and continue"; that the Reality Constraints are filled
      in or explicitly marked not-applicable, especially what each dependency does NOT guarantee;
      and that none of these contradict each other or the business rules — in particular that BR-2's
      exact refund amount is reconcilable with the payment provider not guaranteeing immediately
      consistent prior-refund totals. Write the verdict to
      workflow/runs/order-cancellation-refund/spec-verdict.md, first line exactly "VERDICT: CLEAR"
      or "VERDICT: CHANGES_REQUESTED", followed by findings.
    write_scope: ["workflow/runs/order-cancellation-refund/spec-verdict.md"]
    exit_criteria:
      type: command
      run: "grep -q '^VERDICT: CLEAR$' workflow/runs/order-cancellation-refund/spec-verdict.md"
    on_fail:
      action: reworking
      reason: "spec has gaps or contradictions — resolve before any test or code exists"

  - id: design
    depends_on: [spec-review]
    brief: >
      needs_ui: true in the spec — produce workflow/runs/order-cancellation-refund/design.md
      covering the order-detail page's new Cancel
      action: a component audit (reuse vs. new, real import paths for whatever component library
      this codebase actually uses), real design tokens (not invented hex values), and all four
      screen states (empty/loading/success/error) for the cancel confirmation flow — including the
      BR-1 rejected-state ("already shipped — use Returns instead") as its own explicit error
      state, not folded into a generic error message. A UI-design-focused skill, if you have one
      installed, fits this stage well.
    write_scope: ["workflow/runs/order-cancellation-refund/design.md"]
    exit_criteria:
      type: artifact_exists
      artifact: "workflow/runs/order-cancellation-refund/design.md"
    on_fail:
      action: fixing
      max_attempts: 2
      escalate_at: 2

  # design-tests (a separate think-then-write split) was tried here and removed: its scenario list
  # duplicated what this brief already enumerates, cost a full extra subagent spawn per run, and
  # parallelizing it with `design` opened a real coverage gap (design.md-only screen states had no
  # path into the frozen tests). First scenario coverage + first code in one stage is the right
  # size for this spec.
  - id: generate-tests
    depends_on: [design]
    brief: >
      Write tests covering every acceptance criterion in the frozen spec. No implementation exists
      yet — these tests must fail for the right reason (missing feature), not error out.

      The spec's acceptance criteria are written as Given-When-Then scenarios — mirror that
      structure 1:1 in the frozen tests rather than translating them into generic unit-test
      assertions. Use whichever form is idiomatic for this stack: Gherkin `.feature` files if
      Cucumber/Behave/SpecFlow tooling is already present or the user wants it, otherwise plain
      `describe`/`it` blocks (or the language's equivalent) named and structured as Given/When/Then
      — e.g. `describe("cancelling a paid order") > describe("given it has already shipped") >
      it("then the request is rejected and Returns is suggested")`. Cover at minimum: BR-1
      (pre-shipment cancel succeeds, post-shipment cancel rejected), BR-2 (refund amount accounts
      for a prior partial refund), BR-3 (refund + inventory release happen atomically), the
      payment-provider-failure and duplicate-cancel edge cases, and the four screen states
      workflow/runs/order-cancellation-refund/design.md defines (including the BR-1
      rejected-shipped state as its own scenario). Each
      scenario should be traceable back to the BR, edge case, or design state it came from — don't
      collapse multiple business rules into one generic "cancel order" test.
    write_scope: ["test/order-cancellation/**"]
    exit_criteria:
      type: command
      run: "npm test -- --listTests order-cancellation && npx eslint test/order-cancellation --rule 'no-undef: error'"
    on_fail:
      action: fixing
      max_attempts: 3
      escalate_at: 2

  # The spec's Reality Constraints name an external payment provider, so the tests will contain
  # doubles that can drift from it — that's the trigger for this stage. It runs BEFORE the freeze
  # so a finding is a bounded fixing loop against generate-tests, not a reworking bounce.
  - id: test-review
    depends_on: [generate-tests]
    brief: >
      The spec's Reality Constraints are fully populated — don't re-derive them, check the tests
      against exactly what's already there. Report a table with one row per item below, each
      marked applicable or n/a with file:line evidence:
        - Payment provider double: does it respect "refund only against a settled charge"? Does
          it avoid assuming idempotency-by-default, immediately-consistent prior-refund totals
          after a write, or that a timeout means the refund did not happen — since BR-2's refund
          amount depends on prior-refund state the provider owns?
        - Inventory service double: does it respect "reservation must exist before release,
          releasing twice is an error"? Does it avoid assuming release is synchronous or
          immediately visible — since BR-3's atomicity depends on failure modes a happy-path
          double will never produce?
        - Non-determinism: is the Clock pinned? Are provider-assigned identifiers pinned? Is the
          provider latency/timeout path deliberately exercised (not left to luck)?
      Path parity does not apply — the spec's Reality Constraints confirm there is only one
      cancellation path, so skip that check rather than re-deriving it. Judgment only — the
      mechanical checks already ran in generate-tests' exit_criteria. Write the verdict to
      workflow/runs/order-cancellation-refund/test-verdict.md, first line exactly "VERDICT: CLEAR"
      or "VERDICT: CHANGES_REQUESTED", followed by findings.
    write_scope: ["workflow/runs/order-cancellation-refund/test-verdict.md"]
    exit_criteria:
      type: command
      run: "grep -q '^VERDICT: CLEAR$' workflow/runs/order-cancellation-refund/test-verdict.md"
    on_fail:
      action: fixing
      max_attempts: 3
      escalate_at: 2
      target: generate-tests

  # Writes nothing. Owns the test paths only so the test-hash has something to snapshot, and
  # re-runs the same checks against the exact commit being locked.
  - id: freeze-tests
    depends_on: [test-review]
    brief: >
      No edits. Snapshot and commit the approved test suite as the frozen baseline every later
      stage is held to.
    write_scope: ["test/order-cancellation/**"]
    freeze_after: true
    exit_criteria:
      type: command
      run: "npm test -- --listTests order-cancellation && npx eslint test/order-cancellation --rule 'no-undef: error'"
    on_fail:
      action: reworking
      reason: "tests no longer pass their own checks at the freeze point — resolve upstream, don't patch here"

  - id: implement-backend
    depends_on: [freeze-tests]
    brief: >
      Implement the cancellation/refund/inventory-release logic against the frozen
      Given-When-Then tests — do not modify test/**. Per BR-3, the refund call and the
      inventory-release must be atomic (single transaction or saga with compensation) — a partial
      failure must never leave the order refunded-but-not-released or released-but-not-refunded.
      Per the edge cases, a failed payment-provider call must leave the order in its original
      `paid` status, not a half-cancelled state, and a cancel racing a ship must let ship win
      (needs a concurrency guard on order status).

      Also install every check in the spec's Runtime Invariants section as a real guard —
      atomicity, duplicate-cancel idempotency, the refund-never-exceeds-uncredited-balance bound,
      and the status-transition guard — each detecting its condition and halting, refusing, or
      alerting rather than proceeding. The frozen tests pass whether or not these exist, since they
      were derived from anticipated cases and the guards are for unanticipated ones, so nothing
      downstream will catch their absence. An implementation-focused skill, if you have one
      installed, fits this stage well.
    write_scope: ["src/orders/**", "src/inventory/**"]
    exit_criteria:
      type: command
      run: "npm test -- order-cancellation --testPathPattern=backend"
    on_fail:
      action: fixing
      max_attempts: 5
      escalate_at: 3

  - id: implement-frontend
    depends_on: [freeze-tests]
    brief: >
      Implement the order-detail page's Cancel action per
      workflow/runs/order-cancellation-refund/design.md — the confirmation step, and
      the four screen states (empty/loading/success/error, including the BR-1 rejected-shipped
      state as its own explicit UI state) it defines. Do not modify test/**. An
      implementation-focused skill, if you have one installed, fits this stage well.
    write_scope: ["src/web/order-detail/**"]
    exit_criteria:
      type: command
      run: "npm test -- order-cancellation --testPathPattern=frontend"
    on_fail:
      action: fixing
      max_attempts: 5
      escalate_at: 3

  # verify-acceptance-criteria needs BOTH implement-* stages (e2e spans components); the two
  # review-* stages below each depend only on their own component and run as early as it lands.
  - id: verify-acceptance-criteria
    depends_on: [implement-backend, implement-frontend]
    brief: >
      The exit_criteria command below already proves this stage's property mechanically — the e2e
      suite covers every Given-When-Then acceptance criterion, including BR-2's
      partial-refund-amount math and BR-3's atomicity end-to-end. No additional manual pass is
      needed: run the command and let its real exit code decide. Per kestra-run's efficiency rule,
      no subagent spawn is warranted for this stage. Targeting note: this e2e gate spans both
      components but on_fail can only name one target — failures route to implement-backend by
      default; when a failure is plainly frontend-only, say so in the failure output so the
      orchestrator routes the fix brief against implement-frontend's write_scope instead.
    write_scope: []
    exit_criteria:
      type: command
      run: "npm run test:e2e -- order-cancellation"
    on_fail:
      action: fixing
      max_attempts: 3
      escalate_at: 2
      target: implement-backend

  # review is split per component so each on_fail.target routes to a stage whose write_scope can
  # legally hold the fix — a single review targeting implement-backend would strand any
  # frontend-only finding (fix diffs land outside the target's write_scope and get reverted every
  # attempt). Each review depends only on its own implement stage: write_scope enforcement means
  # the sibling can't touch this component's paths, so the diff under review is already final.
  - id: review-backend
    depends_on: [implement-backend]
    brief: >
      Review the backend diff (src/orders/**, src/inventory/**) since the last stage commit for
      correctness, edge cases, and injection/authn/secrets risk — in particular that the refund
      amount (BR-2) is computed from the payment provider's actual prior-refund record rather than
      trusted client input, and that the atomic refund+release (BR-3) has no window where a crash
      leaves the order half-cancelled. Confirm every Runtime Invariant from the spec is present in
      the diff as an actual guard that halts or refuses — this is the only stage that can catch a
      missing one, since the frozen tests pass either way. Passing tests only prove the spec's own
      acceptance criteria — this stage exists to catch what the spec never thought to test for.
      Whatever code-review and security-review skills you have available both fit this stage well;
      try them, proceed with a direct review if none are available. Write the verdict to
      workflow/runs/order-cancellation-refund/review-backend-verdict.md as the first line,
      exactly: "VERDICT: CLEAR" or "VERDICT: CHANGES_REQUESTED", followed by findings.
    write_scope: ["workflow/runs/order-cancellation-refund/review-backend-verdict.md"]
    exit_criteria:
      type: command
      run: "grep -q '^VERDICT: CLEAR$' workflow/runs/order-cancellation-refund/review-backend-verdict.md"
    on_fail:
      action: fixing
      max_attempts: 3
      escalate_at: 2
      target: implement-backend

  - id: review-frontend
    depends_on: [implement-frontend]
    brief: >
      Review the frontend diff (src/web/order-detail/**) since the last stage commit for
      correctness and injection/XSS risk — in particular that the Cancel flow renders all four
      screen states workflow/runs/order-cancellation-refund/design.md defines (with the BR-1
      rejected-shipped state as its own explicit
      state, not a generic error), that no refund amount or order status shown to the user is
      computed client-side from trusted input, and that design.md's components/tokens are actually
      used rather than one-off styles. Whatever code-review and security-review skills you have
      available both fit this stage well; try them, proceed with a direct review if none are
      available. Write the verdict to
      workflow/runs/order-cancellation-refund/review-frontend-verdict.md as the first line,
      exactly: "VERDICT: CLEAR" or "VERDICT: CHANGES_REQUESTED", followed by findings.
    write_scope: ["workflow/runs/order-cancellation-refund/review-frontend-verdict.md"]
    exit_criteria:
      type: command
      run: "grep -q '^VERDICT: CLEAR$' workflow/runs/order-cancellation-refund/review-frontend-verdict.md"
    on_fail:
      action: fixing
      max_attempts: 3
      escalate_at: 2
      target: implement-frontend

  - id: done
    depends_on: [verify-acceptance-criteria, review-backend, review-frontend]
    brief: >
      Every upstream stage passed. Write a one-page
      workflow/runs/order-cancellation-refund/completion-summary.md: what shipped, which
      commits, the review verdict, and confirmation that BR-1/2/3 all have passing
      Given-When-Then coverage.
    write_scope: ["workflow/runs/order-cancellation-refund/completion-summary.md"]
    exit_criteria:
      type: artifact_exists
      artifact: "workflow/runs/order-cancellation-refund/completion-summary.md"
    on_fail:
      action: fixing
      max_attempts: 2
      escalate_at: 2
